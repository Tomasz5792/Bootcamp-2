description: |-
  ## Car-Go Rentals — Fleet Management API

  This collection covers the core HTTP endpoints for the **Car-Go Rentals** vehicle fleet management system, built as part of the Networking & Platform Technologies module.

  ### What this collection does

  The requests let you interact with a locally-running Flask API (`http://127.0.0.1:5000`) to manage a rental vehicle inventory end-to-end:

  | Request | Method | Purpose |
  | --- | --- | --- |
  | Get All Vehicles | GET | Full inventory listing regardless of status |
  | Get Available Vehicles | GET | Filter fleet to vehicles ready for rental |
  | Get Rented Vehicles | GET | View vehicles currently out on hire |
  | Get Vehicle By VRM | GET | Look up a single vehicle by registration mark |
  | Add Vehicle | POST | Register a new vehicle in the fleet |
  | Delete Vehicle | DELETE | Permanently remove a vehicle record |
  | Vehicle Status Report | GET | Summary count of vehicles by status |
  | Branch Vehicle Report | GET | Fleet distribution broken down by branch |

  ### Key details

  - **Base URL:** `http://127.0.0.1:5000` — start the Flask app locally before sending requests.
      
  - **VRM lookup:** The _Get Vehicle By VRM_ request reads from the `vrm` collection variable. Set this variable before sending, or the pre-request script will block the call with a clear error message.
      
  - **Add Vehicle body:** A sample Toyota Yaris payload is pre-filled as a starting point — update the fields as needed.
      
  - **Reports:** _Vehicle Status Report_ and _Branch Vehicle Report_ provide aggregate views useful for logistics and inventory oversight.
