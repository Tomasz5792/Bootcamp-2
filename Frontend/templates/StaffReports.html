<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports - Staff Portal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN for data visualization graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 min-h-screen flex flex-col">

    <!-- Staff Portal Navigation Bar -->
    <nav class="bg-slate-900 shadow-md relative z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center">
                <i class="fa-solid fa-car-side text-blue-400 text-2xl mr-2"></i>
                <span class="text-xl font-bold text-white tracking-tight">AutoRent <span class="text-blue-400 font-medium">Staff</span></span>
            </div>
            <div class="flex space-x-6 text-sm font-medium text-slate-300">
                <a href="/staffhome" class="hover:text-white transition">Dashboard</a>
                <a href="/staff/rental" class="hover:text-white transition">Manage Fleet</a>
                <a href="/staff/reports" class="text-white transition">Reports</a>
                <a href="/" class="ml-4 pl-4 border-l border-slate-700 text-slate-400 hover:text-white transition">Exit Portal</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <!-- Page Header & Print Controls -->
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">Fleet Analytics & Reports</h1>
                <p class="text-gray-500 mt-2">Real-time business intelligence and vehicle distribution.</p>
            </div>
            <button onclick="window.print()" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold rounded-lg text-sm px-5 py-2.5 shadow-sm transition">
                <i class="fa-solid fa-print mr-2"></i> Print Report
            </button>
        </div>

        <!-- CHARTS GRID CONTAINER -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            
            <!-- CHART 1: Global Fleet Status (Doughnut Chart) -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold text-gray-900 mb-6 border-b pb-3">Global Fleet Status</h2>
                <div class="relative h-72 w-full flex justify-center">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- CHART 2: Inventory by Branch (Bar Chart) -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold text-gray-900 mb-6 border-b pb-3">Inventory by Branch</h2>
                <div class="relative h-72 w-full">
                    <canvas id="branchChart"></canvas>
                </div>
            </div>

        </div>

        <!-- DATA SUMMARY TABLE -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold text-gray-900 mb-6 border-b pb-3">Branch Summary Table</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b border-gray-200">
                            <th class="p-4 font-bold">Branch Location</th>
                            <th class="p-4 font-bold text-right">Total Vehicles</th>
                        </tr>
                    </thead>
                    <tbody id="branch-table-body" class="divide-y divide-gray-100">
                        <!-- Populated dynamically via JavaScript -->
                        <tr><td colspan="2" class="p-4 text-center text-gray-500">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Fetch & Render: Fleet Status (DOUGHNUT CHART)
            fetch('/reports/status')
                .then(res => res.json())
                .then(data => {
                    const labels = [];
                    const counts = [];
                    const backgroundColors = [];

                    data.forEach(item => {
                        labels.push(item.status);
                        counts.push(item.total);
                        
                        // Assign custom color codes based on vehicle status
                        if(item.status === 'AVAILABLE') backgroundColors.push('#22c55e'); // Green
                        else if(item.status === 'RENTED') backgroundColors.push('#3b82f6'); // Blue
                        else if(item.status === 'DAMAGED') backgroundColors.push('#ef4444'); // Red
                        else backgroundColors.push('#f97316'); // Orange (Service Required)
                    });

                    const ctxStatus = document.getElementById('statusChart').getContext('2d');
                    new Chart(ctxStatus, {
                        type: 'doughnut',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: counts,
                                backgroundColor: backgroundColors,
                                borderWidth: 2,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                })
                .catch(err => console.error("Error loading status report:", err));


            // 2. Fetch & Render: Branch Inventory (BAR CHART & DATA TABLE)
            fetch('/api/reports/branch-inventory')
                .then(res => res.json())
                .then(data => {
                    const branchNames = [];
                    const carCounts = [];
                    const tableBody = document.getElementById('branch-table-body');
                    tableBody.innerHTML = ''; // Clear loading placeholder

                    data.forEach(item => {
                        branchNames.push(item.branch);
                        carCounts.push(item.car_count);
                        
                        // Build table row HTML
                        const row = `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-4 font-semibold text-gray-900"><i class="fa-solid fa-location-dot text-gray-400 mr-2"></i> ${item.branch}</td>
                                <td class="p-4 text-right font-bold text-blue-600">${item.car_count}</td>
                            </tr>
                        `;
                        tableBody.insertAdjacentHTML('beforeend', row);
                    });

                    const ctxBranch = document.getElementById('branchChart').getContext('2d');
                    new Chart(ctxBranch, {
                        type: 'bar',
                        data: {
                            labels: branchNames,
                            datasets: [{
                                label: 'Vehicles per Branch',
                                data: carCounts,
                                backgroundColor: '#6366f1', // Indigo
                                borderRadius: 6
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true, ticks: { precision: 0 } }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                })
                .catch(err => console.error("Error loading branch report:", err));
        });
    </script>
</body>
</html>
